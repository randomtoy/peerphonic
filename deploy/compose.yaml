services:
  peerphonic:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
      - "${PEERPHONIC_TORRENT_PORT:-42069}:${PEERPHONIC_TORRENT_PORT:-42069}/tcp"
      - "${PEERPHONIC_TORRENT_PORT:-42069}:${PEERPHONIC_TORRENT_PORT:-42069}/udp"
    volumes:
      - "${MUSIC_DIR:?set MUSIC_DIR to the host music directory}:/music:ro"
      - "./data:/data"
    environment:
      PEERPHONIC_USERNAME: "${PEERPHONIC_USERNAME:-admin}"
      PEERPHONIC_PASSWORD: "${PEERPHONIC_PASSWORD:?set PEERPHONIC_PASSWORD}"
      PEERPHONIC_TORRENT_PORT: "${PEERPHONIC_TORRENT_PORT:-42069}"
      PEERPHONIC_TORRENT_MAX_ACTIVE_DOWNLOADS: "${PEERPHONIC_TORRENT_MAX_ACTIVE_DOWNLOADS:-3}"
      PEERPHONIC_SLSKD_URL: "${PEERPHONIC_SLSKD_URL:-}"
      PEERPHONIC_SLSKD_API_KEY: "${PEERPHONIC_SLSKD_API_KEY:-}"
      PEERPHONIC_SLSKD_DOWNLOADS_DIR: "/data/cache/soulseek/downloads"
      PEERPHONIC_SLSKD_INCOMPLETE_DIR: "/data/cache/soulseek/incomplete"
      PEERPHONIC_SLSKD_MAX_ACTIVE_DOWNLOADS: "${PEERPHONIC_SLSKD_MAX_ACTIVE_DOWNLOADS:-2}"
      PEERPHONIC_SLSKD_RETRY_ATTEMPTS: "${PEERPHONIC_SLSKD_RETRY_ATTEMPTS:-3}"
      PEERPHONIC_SLSKD_PREBUFFER_BYTES: "${PEERPHONIC_SLSKD_PREBUFFER_BYTES:-1048576}"
      PEERPHONIC_SLSKD_PREBUFFER_TIMEOUT_SECONDS: "${PEERPHONIC_SLSKD_PREBUFFER_TIMEOUT_SECONDS:-15}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${PEERPHONIC_WEB_PORT:-8081}:8080"
    depends_on:
      peerphonic:
        condition: service_healthy
    restart: unless-stopped
