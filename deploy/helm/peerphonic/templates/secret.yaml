{{- if not .Values.auth.existingSecret }}
{{- if and .Values.slskd.enabled (lt (len .Values.slskd.apiKey) 16) }}
{{- fail "slskd.apiKey must contain at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "peerphonic.secretName" . }}
  labels:
    {{- include "peerphonic.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.keys.adminUsername }}: {{ required "auth.adminUsername is required" .Values.auth.adminUsername | quote }}
  {{ .Values.auth.keys.adminPassword }}: {{ required "auth.adminPassword is required, or set auth.existingSecret" .Values.auth.adminPassword | quote }}
  {{- if .Values.slskd.enabled }}
  {{ .Values.auth.keys.slskdApiKey }}: {{ required "slskd.apiKey is required when slskd is enabled" .Values.slskd.apiKey | quote }}
  {{ .Values.auth.keys.slskdWebUsername }}: {{ required "slskd.webUsername is required when slskd is enabled" .Values.slskd.webUsername | quote }}
  {{ .Values.auth.keys.slskdWebPassword }}: {{ required "slskd.webPassword is required when slskd is enabled" .Values.slskd.webPassword | quote }}
  {{ .Values.auth.keys.soulseekUsername }}: {{ required "slskd.soulseekUsername is required when slskd is enabled" .Values.slskd.soulseekUsername | quote }}
  {{ .Values.auth.keys.soulseekPassword }}: {{ required "slskd.soulseekPassword is required when slskd is enabled" .Values.slskd.soulseekPassword | quote }}
  {{- end }}
{{- end }}
