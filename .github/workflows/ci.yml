name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  interfaces:
    name: Web and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Check dashboard JavaScript
        run: node --check web/app.js
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.1.1
      - name: Lint chart with bundled slskd
        run: >-
          helm lint --strict deploy/helm/peerphonic
          --set auth.existingSecret=peerphonic-auth
      - name: Render full chart
        run: >-
          helm template peerphonic deploy/helm/peerphonic
          --namespace peerphonic
          --set auth.existingSecret=peerphonic-auth
          > /tmp/peerphonic-full.yaml
      - name: Render external-storage chart
        run: >-
          helm template peerphonic deploy/helm/peerphonic
          --namespace peerphonic
          --set auth.existingSecret=peerphonic-auth
          --set slskd.enabled=false
          --set web.enabled=false
          --set persistence.existingClaim=peerphonic-data
          --set music.existingClaim=music-library
          > /tmp/peerphonic-minimal.yaml
      - name: Render scheduled-backup chart
        run: >-
          helm template peerphonic deploy/helm/peerphonic
          --namespace peerphonic
          --set auth.existingSecret=peerphonic-auth
          --set backup.enabled=true
          > /tmp/peerphonic-backup.yaml

  containers:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
